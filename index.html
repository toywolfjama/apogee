<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crux | Study for AP, SAT and ACT</title>
<meta name="description" content="Free lessons, interactive labs and timed practice for AP Physics 1, AP CSA, French, AP Precalculus, the SAT and the ACT.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/clean.css">
</head>
<body class="th-clean home" data-root="">
<main class="hm">
  <section class="hm-top">
    <div class="hm-l">
      <h1 class="hm-h1"><span class="mark">Pick a course.</span></h1>
      <button class="hm-search" type="button" data-search><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search any lesson or topic</span><span class="kbd" id="hm-kbd">⌘K</span></button>
    </div>
    <div class="hm-r" id="resume"></div>
  </section>
  <section class="sy" id="courses" aria-label="Courses"></section>
  <section class="hm-tools" aria-label="Tools">
    <a href="review.html"><b>Flashcards</b><span>Spaced repetition decks for every course</span></a>
    <a href="mistakes.html"><b>Mistakes</b><span id="hm-mist">Questions you miss are saved here to retry</span></a>
    <a href="calculator.html"><b>TI-84 programs</b><span>Formula and solver programs to load</span></a>
    <a href="courses/sat/sat-desmos.html"><b>Desmos tactics</b><span>Regressions, graphing, sliders</span></a>
  </section>
</main>
<footer>Crux is free and has no ads. Not affiliated with the College Board or ACT.</footer>
<script src="assets/js/courses.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  const C = window.SITE_COURSES || [], X = window.Crux;
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  if (!/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) document.getElementById("hm-kbd").textContent = "Ctrl K";
  document.getElementById("courses").innerHTML = C.map(c => {
    const ready = c.units.filter(u => u.path && u.ready !== false);
    let started = 0;
    const groups = []; c.units.forEach(u => { const g = u.group || ""; let G = groups.find(x => x.n === g); if (!G) groups.push(G = { n: g, l: [] }); G.l.push(u); });
    const rows = groups.map(G => (G.n ? `<li class="sy-g">${esc(G.n)}</li>` : "") + G.l.map(u => {
      if (!(u.path && u.ready !== false)) return `<li class="sy-u soon"><span class="bub"></span><span class="nm">${esc(u.name)}</span><em>Coming</em></li>`;
      const s = X && X.unitStats(u.path); if (s && s.visited) started++;
      const pct = s && s.answered ? Math.round(100 * s.correct / s.answered) : null;
      return `<li class="sy-u${s && s.visited ? " seen" : ""}"><a href="${u.path}"><span class="bub"></span><span class="nm">${esc(u.name)}</span>${pct !== null ? `<em>${pct}%</em>` : ""}</a></li>`;
    }).join("")).join("");
    return `<article class="sy-c c-${c.id}">
      <header><h2><span>${esc(c.name.replace(/^Math: /, ""))}</span></h2><p>${esc(c.blurb || "")}</p><div class="sy-meta">${started ? `${started} of ${ready.length} started` : `${ready.length} lessons`}</div></header>
      <ol class="sy-list${ready.length > 7 ? " two" : ""}">${rows}</ol>
    </article>`;
  }).join("");
  const last = X && X.get("crux.last", null), mist = X ? Object.keys(X.get("crux.mistakes", {})).length : 0, r = document.getElementById("resume");
  let h = "";
  if (last && last.unit) { const c = C.find(x => x.id === last.c); h += `<a class="hm-cont c-${last.c}" href="${last.unit}"><small>Pick up where you left off</small><b>${esc(last.t)}</b><span>${esc(c ? c.name : "")}</span></a>`; }
  if (mist) h += `<a class="hm-mist" href="mistakes.html"><b>${mist}</b> missed question${mist > 1 ? "s" : ""} to retry</a>`;
  if (!h) h = `<div class="hm-hint"><b>New here?</b> Open any lesson. Your progress and missed questions save automatically in this browser.</div>`;
  r.innerHTML = h;
  if (mist) document.getElementById("hm-mist").textContent = `${mist} missed question${mist > 1 ? "s" : ""} waiting`;
})();
</script>
</body>
</html>
