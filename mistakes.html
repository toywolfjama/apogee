<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mistakes | Crux</title>
<meta name="description" content="Free lessons, interactive labs and timed practice for AP Physics 1, AP CSA, French, AP Precalculus, the SAT and the ACT.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/clean.css">
<script>try{var t=localStorage.getItem("crux.theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
</head>
<body class="th-clean c-mistakes" data-root="">
<div class="hero"><span class="kicker">Review</span><h1>Your <span class="hl">mistakes</span></h1><p>Every question you miss on any page is saved here, in this browser. Answer it correctly and it disappears.</p></div>
<main class="page" id="mk"></main>
<footer>Crux · Saved only on this device</footer>
<script src="assets/js/courses.js"></script>
<script>
(function () {
  let M = {}; try { M = JSON.parse(localStorage.getItem("crux.mistakes")) || {}; } catch (e) {}
  const C = window.SITE_COURSES || [], el = document.getElementById("mk");
  const keys = Object.keys(M).sort((a, b) => M[b].ts - M[a].ts);
  if (!keys.length) { el.innerHTML = '<section class="topic mk-empty"><h2>Nothing to review</h2><p>Missed questions from any practice set, quiz or timed exam show up here automatically. Go answer some questions and come back.</p><p><a class="navbtn solid" href="index.html">Pick a course</a></p></section>'; return; }
  const groups = {};
  keys.forEach(k => { const m = M[k]; (groups[m.course] = groups[m.course] || []).push(Object.assign({}, m, { __k: k, t: m.course, q: `<div class="mk-src"><a href="${m.unit}">${(m.title || "").replace(/</g, "&lt;")}</a></div>` + m.q })); });
  let html = `<div class="mk-bar"><span><b>${keys.length}</b> to retry</span><button class="btn" id="mk-clear">Clear all</button></div>`;
  Object.entries(groups).forEach(([cid, list], i) => {
    const c = C.find(x => x.id === cid);
    html += `<section class="topic"><h2>${c ? c.name : "Other"} <span class="pill">${list.length}</span></h2><div class="quiz" data-src="mk-${i}"></div></section><script type="application/json" id="mk-${i}">${JSON.stringify(list).replace(/</g, "\\u003c")}<\/script>`;
  });
  el.innerHTML = html;
  document.getElementById("mk-clear").onclick = () => { if (confirm("Clear all saved mistakes?")) { localStorage.removeItem("crux.mistakes"); location.reload(); } };
})();
</script>
<script src="assets/js/site.js"></script>
<script src="assets/js/exam.js"></script>
</body>
</html>
